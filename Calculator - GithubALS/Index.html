<!DOCTYPE html>
<html>
    <head>
        <title>Calculator Website Template Github</title>
        <style>

body {
        background-color: rgba(234, 249, 255, 0.893);
        color: rgb(0, 0, 0);
        font-family:  Palatino, sans-serif;
         }
            .calculator {
                width: 400px;
                height: 600px;
                border: 5px solid rgb(69, 95, 101);
                padding: 10px;
               background-color: rgb(98, 138, 148);
                text-align: center;
            }
            .calculator input[type="text"] {
                width: 90%;
                height: 40px;
                font-size: 20px;
                text-align: right;
                margin-bottom: 10px;
                padding: 5px;
                border: 2px solid rgb(64, 74, 76);
                
            }
            .buttons {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                
            }
            .buttons button {
                align-items: center;
                width: 70px;
                height: 80px;
                margin: 5px;
                font-size: 18px;
                cursor: pointer;
                border: none;
                border-radius: 5px;
                background-color: rgb(176, 235, 255);
                border: 2px solid rgb(94, 123, 129);
            }

                .Exit {
                    height: 100px;
                    width: 100px;
                    background-color:rgb(255, 236, 152) ;
                    border-radius: 50%;
                    border:rgb(209, 194, 125), 2px, solid;
                    display: inline-block;
                    overflow: hidden;
            }

            .Exit img {
                width: 100%;
             height: 100%;
             object-fit: cover;
          }
          
          h2 {
           font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
         background-color: rgb(105, 156, 173);
         border: 5px solid rgb(86, 131, 146);
         width: 120px;
         height: 40px;
        }
        </style>
    </head>

    <body>

        <div align="center">
            <div class="calculator">
                <div align="center">
                <h2>Calculator</h2>
            </div>
                <input type="text" id="num1" placeholder="0" />
                <div class="buttons">
                    <button onclick="appendValue('7')">7</button>
                    <button onclick="appendValue('8')">8</button>
                    <button onclick="appendValue('9')">9</button>
                    <button onclick="appendValue('/')">/</button>
                    <button onclick="clearInput()">C</button>
                    <button onclick="appendValue('4')">4</button>
                    <button onclick="appendValue('5')">5</button>
                    <button onclick="appendValue('6')">6</button>
                    <button onclick="appendValue('*')">*</button>
                    <button onclick="appendValue('1')">1</button>
                    <button onclick="appendValue('2')">2</button>
                    <button onclick="appendValue('3')">3</button>
                    <button onclick="appendValue('-')">-</button>
                    <button onclick="appendValue('0')">0</button>
                    <button onclick="appendValue('.')">.</button>
                    <button onclick="calculateResult()">=</button>
                    <button onclick="appendValue('+')">+</button>
                </div>
            </div>
        </div>
        <script>
            function appendValue(value) {
                document.getElementById('num1').value += value;
            }

            function clearInput() {
                document.getElementById('num1').value = '';
            }

            function calculateResult() {
                try {
                    const result = eval(document.getElementById('num1').value);
                    document.getElementById('num1').value = result;
                } catch (error) {
                    document.getElementById('num1').value = 'Error';
                }
            }
        </script>
    </body>
</html>
